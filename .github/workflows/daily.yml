name: Daily Market Check
# Force sync update

on:
  schedule:
    # Runs at 22:00 UTC, after the regular US equity close in both DST offsets.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-canary:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Agent
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        POWER_EXPONENTS_ENABLED: ${{ vars.POWER_EXPONENTS_ENABLED || '0' }}
      run: |
        python src/agent.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "AI Agent"
        git config --global user.email "actions@github.com"
        
        # Check if there are changes to commit
        if [[ -n $(git status --short -- data) ]]; then
          git add data
          git commit -m "Daily Update: $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes to data/"
        fi
